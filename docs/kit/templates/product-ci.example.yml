# product-ci.example.yml — COPY into the product repo as:
#   .github/workflows/product-ci.yml
#
# Zero-edit allowed (product-* prefix). Never commit this as a live workflow
# under the kit's .github/workflows/ — GH runs every YAML there, and the bare
# kit has no product apps.
#
# Pair with scripts/product/validate.sh, copied from product-validate.example.sh.
# If you put the script inside an App, point the Product validate command below at it.
# Root already owns workspace quality. This workflow builds deployment artifacts
# and runs only Product-specific guards, through that one script.
#
# Existing Products: keep Product-specific setup and checks; use the pinned Node
# setup and inherited install step below. Do not edit Kit files.
#
# See: docs/kit/product-consumer-contract.md · docs/kit/playbooks/start-product.md#day-0-checklist
name: Product CI

on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, staging]
  workflow_dispatch: {}

concurrency:
  group: product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  product-validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: product-validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pin SHAs (supply-chain); tags float — match kit .github/workflows/ci.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        run: bash scripts/kit/ci-install.sh

      - name: Product validate
        run: bash scripts/product/validate.sh
