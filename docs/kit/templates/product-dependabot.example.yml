# Generated by scripts/kit/configure-product-dependabot.cjs; do not edit.
# Scan scope is not a lockfile mutation boundary. Review the entire bun.lock.
version: 2
updates:
  - package-ecosystem: bun
    directories:
      - "/apps/product-api"
      - "/apps/product-web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      bun-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "wrangler"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - major
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    labels:
      - dependencies
