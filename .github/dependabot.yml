# Kit Dependabot — bun.lock + inherited GitHub Actions.
# Products: node scripts/kit/configure-product-dependabot.cjs generates the
# bounded Product App scan at this same fixed path. Do not copy this root scan.
# Cooldown 3d on patch/minor; github-actions supports default-days only.
#
# Bun supports VERSION updates, NOT native security-update PRs.
# Keep alerts enabled; Slack's alert snapshot is manual, not continuous monitoring.
# See docs/kit/security-dependabot.md for manual remediation and Kit escalation.
#
# Grouping policy (kit deps waves 2026-08):
# - patch/minor bun → bun-dependencies
# - major vitest + @vitest/* → one PR
# - major @commitlint/* → one PR
# - major github-actions → one PR
# - trufflesecurity/trufflehog — ignored (SSoT `config/kit/trufflehog.version`; action-only PRs fail `--assert-pin`)
# - major zod / typescript / fastmcp / lucide-react → individual PRs (no group)
# - wrangler — leaves the group: one PR of its own, never auto-labeled (dependabot-automerge.yml). The committed
#   apps/*/src/worker-configuration.d.ts is generated by `wrangler types` and `wrangler types --check` (in each app's
#   `typecheck`) fails after any wrangler bump until it is regenerated (`bun run types` in apps/example-api and
#   apps/mcp-example), so agents regenerate and obtain independent review before normal authorized landing.
#
# Supply-chain layers around these PRs (docs/kit/security-dependabot.md § Install-time layers, § Auto-merge guard):
# - cooldown below = bunfig.toml `minimumReleaseAge` (259200 s = 3 d). Keep both equal: check-deps-guard.ts reads the
#   bunfig value as the guard's age threshold, and test:deps-guard fails when they drift from `default-days` here.
# - deps-automerge is only applied after scripts/kit/check-deps-guard.ts passes (provenance, publisher, install
#   scripts, age, advisories, unpinned/impostor action SHAs).
#
# Ecosystem is bun (not npm): the npm updater edits package.json and leaves
# bun.lock stale, so CI `bun install --frozen-lockfile` fails before the suite.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      bun-dependencies:
        patterns:
          - "*"
        # Majors excluded from the group → individual PRs (independent-agent review),
        # except explicit major groups below.
        update-types:
          - minor
          - patch
        # wrangler: own PR (see header) — regenerate worker-configuration.d.ts before merge.
        exclude-patterns:
          - "wrangler"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - major
      commitlint:
        patterns:
          - "@commitlint/*"
        update-types:
          - major
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Majors together (checkout + upload-artifact etc.) — one reviewable PR.
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
    ignore:
      # SSoT is config/kit/trufflehog.version (version + checksums + action_sha).
      # CI uses the shared script, and --assert-pin requires zero action uses to preserve
      # its introduced-commit range walk. Bump version, archive and binary hashes,
      # historical action_sha, and workflow annotation together.
      # Security updates are not covered by ignore; handle them via the SSoT.
      - dependency-name: "trufflesecurity/trufflehog"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    # github-actions supports ONLY default-days — semver-*-days fail the whole file.
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - ci
