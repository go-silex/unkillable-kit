name: Deploy verify

# go-silex/unkillable-kit#215 — after the Deploy gate, check from outside that every promoted Worker
# serves the promoted commit, and post one Slack alert when one does not by the deadline. Each Worker
# deploy is tagged with its commit (`wrangler deploy --tag`, scripts/kit/cf-builds/require-deploy-sha.sh)
# and its public health response reports that tag as `versionTag`. The targets come from
# config/product/deploy-verify.json at deploy/<branch>; no such file, nothing verified (opt-in).
# Runbook: docs/kit/deploy-verify.md.
#
# Which branch: a Deploy gate run started by workflow_run always runs on the default branch, so its
# run does not say which source branch it evaluated. Every gate run that evaluated one (its job ran)
# verifies both deploy/main and deploy/staging; a gate run of a pull-request CI run evaluates none
# and verifies nothing. A branch already served passes at once.
#
# Trust: the same as the Deploy gate's. The script, its Bun version and the config come from a
# checkout of the already-promoted deploy/<branch>, never from an untested tip. Residual by design:
# this YAML itself is always the default branch's. Read-only: no Cloudflare credential, no App
# token, GITHUB_TOKEN limited to contents + actions read, the checkout keeps no credential; nothing
# here can write to deploy/*. The Slack token never reaches the script: only the posting step reads
# it, and hands it to curl on stdin.
#
# One alert per branch and SHA: after a successful post, an artifact named after them is uploaded,
# and a later run that finds it does not post again (retention 90 days). Runs for one branch are
# serialized. No token, no Slack channel variable or a Slack error: a warning, and the failed run
# stays the alert of last resort.

on:
  workflow_run:
    workflows: [Deploy gate]
    types: [completed]
  # By hand: one branch, optionally against a given SHA instead of the deploy/<branch> tip (test).
  workflow_dispatch:
    inputs:
      branch:
        description: Source branch whose deploy/<branch> to verify
        type: choice
        options: [main, staging]
        default: main
      expected_sha:
        description: Full commit SHA to expect instead of the deploy/<branch> tip (empty = the tip)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  evaluated:
    name: Did the Deploy gate evaluate a branch?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      evaluated: ${{ steps.gate.outputs.evaluated }}
    steps:
      - name: Read the Deploy gate run's jobs
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          GATE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != workflow_run ]; then
            echo "evaluated=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$GATE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error title=Deploy verify::the triggering Deploy gate run has no id"
            exit 1
          fi
          # A lookup failure verifies anyway: a needless check beats a missed one.
          if ! ran="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GATE_RUN_ID}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion != "skipped")] | length' 2>/dev/null)"; then
            echo "::warning title=Deploy verify::the jobs of Deploy gate run ${GATE_RUN_ID} could not be read; verifying anyway."
            ran=unknown
          fi
          if [ "$ran" = 0 ]; then
            echo "::notice title=Deploy verify::Deploy gate run ${GATE_RUN_ID} evaluated no branch; nothing to verify."
            echo "evaluated=false" >>"$GITHUB_OUTPUT"
          else
            echo "evaluated=true" >>"$GITHUB_OUTPUT"
          fi

  verify:
    needs: evaluated
    if: needs.evaluated.outputs.evaluated == 'true'
    name: deploy/${{ matrix.branch }}
    runs-on: ubuntu-latest
    # Above the 60-minute ceiling of timeoutMinutes, plus setup.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Fixed literals only: the dispatch input picks one, it is never interpolated.
        branch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.branch == 'staging' && '["staging"]' || '["main"]') || '["main","staging"]') }}
    concurrency:
      group: deploy-verify-${{ matrix.branch }}
      cancel-in-progress: false
    env:
      SOURCE_BRANCH: ${{ matrix.branch }}
    steps:
      # 404 = no deploy branch (not cut over, or a kit tree): nothing to verify. Any other failure
      # is an error, never "not configured".
      - name: Resolve deploy/${{ matrix.branch }}
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if out="$(gh api "repos/${GITHUB_REPOSITORY}/branches/deploy%2F${SOURCE_BRANCH}" --jq .commit.sha 2>&1)"; then
            if [[ ! "$out" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=Deploy verify::deploy/${SOURCE_BRANCH} resolved to no commit SHA"
              exit 1
            fi
            echo "sha=${out}" >>"$GITHUB_OUTPUT"
          elif [[ "$out" == *"HTTP 404"* ]]; then
            echo "::notice title=Deploy verify: no config::deploy/${SOURCE_BRANCH} does not exist; nothing verified."
          else
            out="${out//$'\n'/ }"
            echo "::error title=Deploy verify cannot read deploy/${SOURCE_BRANCH}::${out//::/: :}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.deploy.outputs.sha != ''
        with:
          ref: ${{ steps.deploy.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Is Deploy verify configured on deploy/${{ matrix.branch }}?
        id: cfg
        if: steps.deploy.outputs.sha != ''
        run: |
          set -euo pipefail
          if [ ! -e config/product/deploy-verify.json ] && [ ! -L config/product/deploy-verify.json ]; then
            echo "::notice title=Deploy verify: no config::deploy/${SOURCE_BRANCH} has no config/product/deploy-verify.json; nothing verified."
            exit 0
          fi
          if [ ! -f scripts/kit/deploy-verify.ts ]; then
            echo "::error title=Deploy verify missing on deploy/${SOURCE_BRANCH}::config/product/deploy-verify.json is present but scripts/kit/deploy-verify.ts is not: promote the kit upgrade that ships it."
            exit 1
          fi
          echo "configured=true" >>"$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.cfg.outputs.configured == 'true'
        with:
          bun-version-file: package.json

      - name: Verify deploy/${{ matrix.branch }} is served
        id: verify
        if: steps.cfg.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.deploy.outputs.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GATE_RUN_ID: ${{ github.event.workflow_run.id }}
          ALERT_FILE: ${{ runner.temp }}/deploy-verify-alert.txt
        run: bun --no-env-file --config=config/kit/bunfig.gates.toml scripts/kit/deploy-verify.ts

      - name: Post the Slack alert
        id: slack
        if: failure() && steps.verify.outputs.alert == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_FLINT_BOT_TOKEN }}
          CHANNEL: ${{ vars.SLACK_CHANNEL_BUGS_ALERT }}
          ALERT_FILE: ${{ runner.temp }}/deploy-verify-alert.txt
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN:-}" ] || [ -z "${CHANNEL:-}" ]; then
            echo "::warning title=Deploy verify: no Slack alert::secret SLACK_FLINT_BOT_TOKEN or variable SLACK_CHANNEL_BUGS_ALERT is not set; this failed run is the alert."
            exit 0
          fi
          body="$(jq -n --arg ch "$CHANNEL" --rawfile t "$ALERT_FILE" \
            '{channel: $ch, text: $t, unfurl_links: false, unfurl_media: false}')"
          # The token goes to curl on stdin (printf is a builtin): never in argv, never echoed.
          if ! resp="$(printf 'header = "Authorization: Bearer %s"\n' "$SLACK_BOT_TOKEN" \
            | curl --disable --silent --show-error --max-time 30 --proto =https --config - \
              --header 'Content-Type: application/json; charset=utf-8' \
              --data-binary "$body" https://slack.com/api/chat.postMessage)"; then
            echo "::warning title=Deploy verify: no Slack alert::chat.postMessage could not be reached; this failed run is the alert."
            exit 0
          fi
          if ! jq -e '.ok == true' >/dev/null <<<"$resp"; then
            error="$(jq -r '.error // "unreadable answer"' <<<"$resp" 2>/dev/null | tr -cd 'a-z_' | head -c 80 || true)"
            echo "::warning title=Deploy verify: no Slack alert::chat.postMessage answered ${error:-an unreadable answer}; this failed run is the alert."
            exit 0
          fi
          echo "posted=true" >>"$GITHUB_OUTPUT"

      - name: Record the alert for this branch and SHA
        if: failure() && steps.slack.outputs.posted == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.verify.outputs.marker }}
          path: ${{ runner.temp }}/deploy-verify-alert.txt
          retention-days: 90
          if-no-files-found: error
